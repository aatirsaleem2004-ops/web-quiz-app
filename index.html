<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Tech Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
  <div class="shell mx-auto">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 m-0">Web Tech Quiz</h1>
      <button id="theme" class="btn btn-outline-secondary btn-sm" aria-label="Switch dark or light mode">🌙 Dark</button>
    </header>

    <!-- Start -->
    <section id="start" class="card-box">
      <h2 class="h3">Test your web skills</h2>
      <p class="text-secondary">5 random questions on HTML, CSS, JavaScript and Bootstrap. You get 20 seconds for each one.</p>
      <button id="go" class="btn btn-primary btn-lg w-100">Start quiz</button>
    </section>

    <!-- Quiz -->
    <section id="quiz" class="card-box d-none">
      <div id="bar" class="segbar mb-3" aria-label="Progress"></div>
      <div class="d-flex justify-content-between small mb-1">
        <span id="count"></span><strong id="time"></strong>
      </div>
      <div class="timer mb-4"><div id="tfill"></div></div>
      <h2 id="qtext" class="h4 mb-4"></h2>
      <div id="opts" class="d-grid gap-2"></div>
      <p id="fb" class="mt-3 mb-0 fw-semibold" aria-live="polite"></p>
      <button id="next" class="btn btn-primary mt-3 w-100 d-none">Next question</button>
    </section>

    <!-- Result -->
    <section id="result" class="card-box d-none">
      <div id="bar2" class="segbar mb-4"></div>
      <h2 class="h3 mb-1">Your score: <span id="score"></span></h2>
      <p id="msg" class="text-secondary"></p>
      <ol id="review" class="list-group list-group-flush mb-4"></ol>
      <div class="d-grid gap-2 d-sm-flex">
        <button id="pdf" class="btn btn-primary flex-fill">Download PDF</button>
        <button id="again" class="btn btn-outline-secondary flex-fill">Try again</button>
      </div>
    </section>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
